name: Release

# release-please: on every push to a release branch it opens/updates a
# "Release PR" whose title shows the exact next version (computed from
# conventional commits). Nothing is tagged or released until that PR is
# merged — merging it is the manual approval step.
on:
  push:
    branches:
      - main
      - '*.x'
      - beta

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          # RELEASE_PLEASE_TOKEN (a fine-grained PAT) is preferred: PRs created
          # with the default GITHUB_TOKEN don't trigger the test workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
