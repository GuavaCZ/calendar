laravel: '@testbench'

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Workbench\App\Providers\AdminPanelProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/admin'
  install: true
  health: false
  discovers:
    config: false
    factories: true
    web: true
    api: false
    commands: false
    components: false
    views: true
  build:
    - asset-publish
    # Publishes Filament's own JS/CSS *and* this package's registered assets into the
    # skeleton's public/. Without it the panel renders but no Alpine component resolves.
    - filament-assets
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync: []
